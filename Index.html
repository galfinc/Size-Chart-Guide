<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Chart Guide by PT Galfinc Indonesia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            border: none;
            background-color: #0077cc;
            color: #fff;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005fa3;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            text-align: center;
            color: #0077cc;
            font-weight: bold;
        }

        .note {
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Size Chart Guide</h1>
        <label for="chest">Lingkar Dada (cm)</label>
        <input type="number" id="chest" placeholder="Misal: 95">

        <label for="height">Tinggi Badan (cm)</label>
        <input type="number" id="height" placeholder="Misal: 170">

        <label for="weight">Berat Badan (kg)</label>
        <input type="number" id="weight" placeholder="Misal: 65">

        <button onclick="calculateSize()">Cek Size</button>

        <div class="result" id="result"></div>
        <div class="note">Rekomendasi ini hanya estimasi, bisa disesuaikan preferensi fit jaket.</div>
    </div>

    <script>
        function calculateSize() {
            let chest = parseInt(document.getElementById("chest").value);
            let height = parseInt(document.getElementById("height").value);
            let weight = parseInt(document.getElementById("weight").value);
            let size = "";

            if (!chest || !height || !weight) {
                document.getElementById("result").innerText = "Mohon isi semua data!";
                return;
            }

            // Logika simple estimasi size berdasarkan chest & height
            if (chest <= 88 && height <= 165) size = "S";
            else if (chest <= 96 && height <= 170) size = "M";
            else if (chest <= 104 && height <= 175) size = "L";
            else if (chest <= 112 && height <= 180) size = "XL";
            else if (chest <= 120 && height <= 185) size = "XXL";
            else if (chest <= 128 && height <= 190) size = "XXXL";
            else if (chest <= 136 && height <= 195) size = "4XL";
            else size = "5XL";

            document.getElementById("result").innerText = `Rekomendasi Size: ${size}`;
        }
    </script>
</body>
</html>
